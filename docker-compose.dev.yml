services:
  app:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
    volumes:
      - ./packages:/app/packages
      - /app/node_modules
      - /app/packages/backend/node_modules
      - /app/packages/frontend/node_modules
      - /app/packages/shared/node_modules
    ports:
      - "3000:3000"
      - "5173:5173"
    command: pnpm dev
